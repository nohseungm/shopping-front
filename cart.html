<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 - Mini Shop</title>
  <!-- 스타일시트 불러오기 -->
  <link rel="stylesheet" href="css/style.css">

<body>
  <!-- 상단 네비게이션 영역 -->

    <div class="cart-actions">
